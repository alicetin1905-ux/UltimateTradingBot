name: Run DMI Toolbox bot

on:
  schedule:
    # Hourly at :20 — after any 1H/2H/4H candle closes, and clear of the
    # UltimateTradingBot run at :05. Each run only processes bars it hasn't
    # seen yet, so running more often than the timeframe is harmless.
    - cron: '20 * * * *'
  workflow_dispatch: {}

# Needed so the job can commit the updated dmi-bot/state/*.json back.
permissions:
  contents: write

concurrency:
  group: dmi-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run bot
        run: node dmi-bot/src/run.js

      - name: Commit updated state
        run: |
          git config user.name "dmi-toolbox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dmi-bot/state/
          git diff --cached --quiet && echo "no state changes" && exit 0
          git commit -m "DMI bot run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The other bot commits to this branch too — rebase onto its
          # latest commit (they never touch the same files) and retry.
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
