name: Reset account

on:
  workflow_dispatch: {}

# Needed so the job can commit the reset state/*.json files back to the repo.
permissions:
  contents: write

concurrency:
  group: trading-bot-run
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reset all coins
        run: node src/reset.js

      - name: Commit reset state
        run: |
          git config user.name "ultimate-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && echo "no state changes" && exit 0
          git commit -m "Reset account via dashboard"
          git push
